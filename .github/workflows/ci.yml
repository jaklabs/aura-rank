name: CI

# The tool scores projects on whether they have tests and CI. Not running its own
# would be the kind of thing a reviewer notices immediately -- and rightly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guarantee:
    # Runs first and alone, because this is the claim the whole project rests on:
    # the scanner cannot exfiltrate your code. If it ever can, nothing else matters.
    name: trust guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No network, no shell, subprocess only ever runs git
        run: python3 tests/test_no_network.py

  test:
    name: tests (py${{ matrix.python }})
    needs: guarantee
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises. It is in the matrix so that promise
        # is checked rather than assumed -- walrus-free, no 3.10+ syntax.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm there are no dependencies to install
        run: |
          test ! -f requirements.txt && test ! -f pyproject.toml \
            && echo "stdlib only, as advertised" || \
            (echo "a dependency file appeared; the zero-dependency claim needs updating" && exit 1)

      - name: Language analyzers
        run: python3 tests/test_langs.py

      - name: Portfolio aggregation and attribution
        run: python3 tests/test_portfolio.py

      - name: Scan a real repository end to end
        # Self-scan: this checkout is a git repo full of Python, so one run
        # exercises git metadata, the tree walk, the AST pass and scoring together.
        run: |
          git fetch --unshallow 2>/dev/null || true
          python3 -m aura.scan .

      - name: Aggregate a portfolio end to end
        run: python3 -m aura.portfolio . --me ci@example.com --min-share 0

      - name: Payload leaks no source text and claims no verified tier
        # The scan output is meant to be shareable, so a path or a line of source
        # leaking into it is a privacy regression rather than a cosmetic one.
        run: |
          python3 -m aura.scan . --json /tmp/payload.json > /dev/null
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/payload.json').read_text())

          # Prose the tool writes about itself is not user data. Drop it before
          # looking for source text, or the scanner's own documentation of its
          # limits ("object or class literals") reads as a leak.
          PROSE = {'note', 'grade_means', 'js_scanner_limits', 'analyzed_languages'}
          def strip(node):
              if isinstance(node, dict):
                  return {k: strip(v) for k, v in node.items() if k not in PROSE}
              if isinstance(node, list):
                  return [strip(v) for v in node]
              return node

          raw = json.dumps(strip(data))
          leaks = []
          for marker in ('/home/', '/Users/', 'runner/work', 'def ', 'import ', 'class '):
              if marker in raw:
                  leaks.append(marker)
          assert not leaks, f'payload leaked: {leaks}'
          assert data['tier'] == 'self-assessed', 'a scan must never claim a verified tier'
          print(f'payload clean ({len(raw)} bytes), tier correctly self-assessed')
          PY
